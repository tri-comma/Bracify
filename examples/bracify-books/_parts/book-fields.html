<!-- Shared form fields for book-new.html / book-edit.html.
     Inside <form data-t-scope="book"> every name="..." is bound automatically (README: form auto-binding).
     Dot names (meta.isbn, tags.0) are saved as nested data. -->
<div class="field">
    <label>Title</label>
    <input type="text" name="title" required maxlength="80">
</div>
<div class="field">
    <label>Author</label>
    <!-- Radio buttons generated by data-t-list: the one matching author_id is checked automatically
         (a <select> whose <option>s come from data-t-list cannot be auto-selected, see examples/README.md). -->
    <label class="inline" data-t-list="authors"><input type="radio" name="author_id" value="{authors.id}" required> {authors.name}</label>
</div>
<div class="field">
    <label>Category</label>
    <label class="inline" data-t-list="categories"><input type="radio" name="category_id" value="{categories.id}" required> {categories.name}</label>
</div>
<div class="field row">
    <div><label>Year</label><input type="number" name="year" min="1000" max="2100"></div>
    <div><label>Pages</label><input type="number" name="pages" min="1"></div>
    <div><label>Price</label><input type="number" name="price" min="0"></div>
    <div><label>Stock</label><input type="number" name="stock" min="0"></div>
</div>
<div class="field">
    <label>Status</label>
    <label class="inline"><input type="radio" name="status" value="published" checked> Published</label>
    <label class="inline"><input type="radio" name="status" value="draft"> Draft</label>
</div>
<div class="field">
    <label class="inline"><input type="checkbox" name="featured" value="true"> Featured</label>
</div>
<div class="field">
    <label>Summary</label>
    <textarea name="summary" rows="4" maxlength="400"></textarea>
</div>
<div class="field row">
    <div><label>Tag 1</label><input type="text" name="tags.0"></div>
    <div><label>Tag 2</label><input type="text" name="tags.1"></div>
    <div><label>Tag 3</label><input type="text" name="tags.2"></div>
</div>
<div class="field row">
    <div><label>ISBN</label><input type="text" name="meta.isbn"></div>
    <div><label>Publisher</label><input type="text" name="meta.publisher"></div>
    <div><label>Published at (ISO)</label><input type="text" name="published_at" placeholder="2025-01-31T12:00:00Z"></div>
</div>
