<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Bracify Studio</title>
    <link data-t-source="projects" href="_sys/data/projects.json">
    <link rel="stylesheet" href="common.css">
    <script src="../engine/lib/engine.cjs"></script>
</head>

<body data-t-include="_parts/layout.html">

    <div data-t-content="main-content">
        <span class="section-label">Overview</span>
        <h1>Welcome Back</h1>

        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem;">
            <div>
                <p style="color: var(--text-muted); margin: 0;">You have {projects._length} projects registered.</p>
            </div>
            <a href="project.html" class="btn-primary">+ Create New Project</a>
        </div>

        <p data-t-if="_sys.query.error" style="color: #ef4444;">{?error}</p>

        <div class="grid">
            <!-- Project Card List -->
            <div data-t-list="projects" class="card">
                <div
                    style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
                    <h3><a href="project.html?id={projects.id}" style="color: inherit; text-decoration: none;">{projects.name}</a></h3>
                    <span class="status-dot {projects.status}"></span>
                </div>

                <div class="path">{projects.path}</div>

                <div
                    style="margin-top: 1.5rem; display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem;">
                    <span style="color: var(--text-muted);">Port: {projects.port}</span>
                    <a href="project.html?id={projects.id}" style="color: var(--accent); font-weight: 500;">Manage &rarr;</a>
                </div>

                <div style="margin-top: 1rem; font-size: 0.85rem;">
                    <div data-t-if="projects.status=running" style="margin-bottom: 0.75rem;">
                        <div style="color: var(--text-muted);">PID: {projects.pid}</div>
                        <a href="http://localhost:{projects.port}/" target="_blank">http://localhost:{projects.port}/</a>
                    </div>
                    <form data-t-if="projects.status:ne=running" method="POST" action="/_sys/server/start">
                        <input type="hidden" name="id" value="{projects.id}">
                        <input type="hidden" name="data-t-redirect" value="/index.html">
                        <button type="submit" class="btn-primary">Start</button>
                    </form>
                    <form data-t-if="projects.status=running" method="POST" action="/_sys/server/stop">
                        <input type="hidden" name="id" value="{projects.id}">
                        <input type="hidden" name="data-t-redirect" value="/index.html">
                        <button type="submit" class="btn-secondary">Stop</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    </div>

</body>

</html>
